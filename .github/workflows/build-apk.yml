
name: Build ChatBam APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ChatBam ZIP
        run: |
          mkdir project
          unzip -q "ChatBam apk.zip" -d project

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        working-directory: project
        run: |
          flutter create --platforms=android --org com.chatbam .
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ChatBam-APK
          path: project/build/app/outputs/flutter-apk/app-release.apk
          
